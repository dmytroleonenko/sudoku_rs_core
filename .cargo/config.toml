# Opt #3c: target-cpu=native enables auto-vectorization of popcount /
# trailing_zeros loops in board.rs and tb.rs, plus tighter instruction
# scheduling for the SHC hot path. Local-only — do not commit a binary
# from here and ship it to a different machine.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=native"]

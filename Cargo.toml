[package]
name = "sudoku_rs_core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Fast-core sudoku solver / generator / dataset pipeline (T1+T2+T3 non-chain + backtracker). Clean-room from algorithmic ideas; no GPL code copied."

[lib]
path = "src/lib.rs"

[[bin]]
name = "sudoku_rs_core"
path = "src/cli.rs"

[dependencies]
rand = "0.8"
rand_xoshiro = "0.6"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
arrow-array = "53"
arrow-schema = "53"
parquet = { version = "53", default-features = false, features = ["arrow", "snap"] }
md-5 = "0.10"
hex = "0.4"
toml = { version = "0.8", default-features = false, features = ["parse"] }
glob = "0.3"
tqdm = "0.8"
mimalloc = { version = "0.1", default-features = false }
rustc-hash = "1.1"

[dev-dependencies]
# R3.4 Stage R restored: criterion bench harness for per-technique perf.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"
sha2 = "0.10"

[[bench]]
name = "techniques"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
